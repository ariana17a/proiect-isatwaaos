name: SLI Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sli-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Measure SLI/SLO/Error Budget
        run: |
          SLO=95
          SUCCESSFUL_RUNS=95
          TOTAL_RUNS=100

          SLI=$(echo "scale=2; $SUCCESSFUL_RUNS / $TOTAL_RUNS * 100" | bc)
          ERROR_BUDGET=$(echo "100 - $SLO" | bc)
          REMAINING_BUDGET=$(echo "$SLI - $SLO" | bc)

          echo "## SLI/SLO Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Successful runs | $SUCCESSFUL_RUNS |" >> $GITHUB_STEP_SUMMARY
          echo "| Total runs | $TOTAL_RUNS |" >> $GITHUB_STEP_SUMMARY
          echo "| SLI availability | $SLI% |" >> $GITHUB_STEP_SUMMARY
          echo "| SLO target | $SLO% |" >> $GITHUB_STEP_SUMMARY
          echo "| Error Budget | $ERROR_BUDGET% |" >> $GITHUB_STEP_SUMMARY
          echo "| Remaining Budget | $REMAINING_BUDGET% |" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$SLI < $SLO" | bc -l) )); then
            echo "SLO was violated."
            exit 1
          else
            echo "SLO is respected."
          fi
