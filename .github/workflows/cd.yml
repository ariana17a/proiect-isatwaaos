name: CD - GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Validate JavaScript syntax
        run: node --check app/app.js

      - name: Run tests before deploy
        run: node tests/todo.test.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Job summary (build)
        run: |
          echo "## CD Verify and Package Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Syntax check: node --check app/app.js" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: node tests/todo.test.js" >> $GITHUB_STEP_SUMMARY
          echo "- Pages artifact path: app/" >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: verify-and-package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary (deploy)
        run: |
          echo "## CD Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
